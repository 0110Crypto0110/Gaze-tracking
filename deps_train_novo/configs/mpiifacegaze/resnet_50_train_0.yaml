mode: MPIIFaceGaze
device: cpu
dataset:
  dataset_dir: C:/Users/joaor/Desktop/GazeTech-main/GazeTech-main/MPIIFaceGaze/MPIIFaceGaze/MPIIFaceGaze_multiregion.h5
transform:
  mpiifacegaze_face_size: 224
  mpiifacegaze_gray: False
model:
  name: multi_region_res50
  in_stride: 2
  saved_model: experiments/mpiifacegaze/multi_region_res50/00/checkpoint_0005.pth
  start_epoch: 0  #checkpoint 5 - 0 para reiniciar
  # backbone:
  #   name: resnet_simple
  #   pretrained: resnet18
  #   resnet_block: basic
  #   resnet_layers: [2, 2, 2]
train:
  batch_size: 8 #16 reduzir pela metade por erro de alocaçao de memoria
  optimizer: adam
  base_lr: 0.0001
  momentum: 0.5
  nesterov: True
  weight_decay: 0.0001
  no_weight_decay_on_bn: False
  loss: L1
  seed: 0
  test_id: 0
  val_ratio: 0.1
  output_dir: experiments/mpiifacegaze/multi_region_res50/
  log_period: 100
  checkpoint_period: 5
  use_tensorboard: True
  train_dataloader:
    num_workers: 0
    drop_last: True
    pin_memory: False
  val_dataloader:
    num_workers: 0
    pin_memory: False
scheduler:
  epochs: 15   #2-test #30-completo
  type: multistep
  milestones: [9, 25]
  lr_decay: 0.1
  lr_min_factor: 0.00001
cudnn:
  benchmark: True
  deterministic: False
